name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.git,__pycache__
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.git,__pycache__
        
    - name: Run tests with pytest
      run: |
        # Add tests when available
        echo "Tests would run here"
        
    - name: Build Docker images
      run: |
        docker-compose build
        
    - name: Test Docker containers
      run: |
        docker-compose up -d
        sleep 10
        # Test API health
        curl -f http://localhost:8000/ || exit 1
        # Test Streamlit health
        curl -f http://localhost:5000/_stcore/health || exit 1
        docker-compose down
